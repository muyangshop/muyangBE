# ── 프로덕션 프로파일 (배포용) ──────────────────────────────
# 실행: SPRING_PROFILES_ACTIVE=prod (호스트 환경변수)
# 시크릿은 전부 환경변수로 주입 — 파일에 실제 값 없음.

# 호스트가 주는 포트 사용 (Render/Railway 등은 $PORT 주입)
server.port=${PORT:8080}

# PostgreSQL — 호스트 DB 접속정보를 환경변수로
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 엔티티 기준으로 테이블 자동 생성/갱신 (빈 DB에 바로 배포 가능) → DataSeeder가 데모 적재
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false
spring.thymeleaf.cache=true

# 업로드 파일 (호스트 임시 디스크 — 재시작 시 초기화됨)
app.upload.dir=${UPLOAD_DIR:/tmp/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT — 반드시 환경변수로 (32자 이상)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# 결제 (선택 — 없으면 빈 값, 결제 실동작은 키 넣은 뒤)
payment.toss.base-url=https://api.tosspayments.com
payment.toss.secret-key=${TOSS_SECRET_KEY:}
payment.kakao.base-url=https://open-api.kakaopay.com
payment.kakao.secret-key=${KAKAO_PAY_SECRET:}
payment.kakao.cid=TC0ONETIME
payment.naver.base-url=https://dev.apis.naver.com
payment.naver.client-id=${NAVER_CLIENT_ID:}
payment.naver.client-secret=${NAVER_CLIENT_SECRET:}
payment.naver.chain-id=${NAVER_CHAIN_ID:}

# 카카오 로그인 (선택)
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:}
