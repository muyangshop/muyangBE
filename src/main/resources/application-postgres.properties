# ── PostgreSQL 프로파일 ──────────────────────────────────────
# 실행:  gradlew.bat bootRun --args="--spring.profiles.active=postgres"
# 접속 정보는 환경변수로 덮어쓸 수 있습니다 (없으면 아래 기본값 사용).

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/muyang}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# 스키마는 db/schema.sql 을 DBeaver에서 직접 만들고, 앱은 검증만 (DDL 자동변경 안 함)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# H2 콘솔은 Postgres 사용 시 비활성화
spring.h2.console.enabled=false

# DataSeeder는 productRepository.count()==0 일 때만 적재되므로
# 빈 DB(스키마만 생성)면 데모 데이터가 자동으로 채워집니다.
