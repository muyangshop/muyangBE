<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head><title>주문 관리</title></head>
<body>
<h1 layout:fragment="pageTitle">주문 관리</h1>
<p layout:fragment="pageDesc">전체 주문 내역을 확인합니다</p>

<div layout:fragment="content">
    <p class="mb-4 text-sm text-navy-soft">총 <span class="font-bold text-navy" th:text="${#lists.size(orders)}">0</span>건</p>

    <div class="overflow-hidden rounded-2xl border border-line bg-white shadow-card">
        <table class="w-full text-sm">
            <thead>
            <tr class="border-b border-line text-left text-xs uppercase tracking-wide text-navy-soft">
                <th class="px-5 py-3 font-semibold">주문번호</th>
                <th class="px-5 py-3 font-semibold">회원 ID</th>
                <th class="px-5 py-3 text-right font-semibold">상품금액</th>
                <th class="px-5 py-3 text-right font-semibold">배송비</th>
                <th class="px-5 py-3 text-right font-semibold">합계</th>
                <th class="px-5 py-3 text-center font-semibold">상태</th>
                <th class="px-5 py-3 text-center font-semibold">상태 변경</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${orders}" class="border-b border-line/60 last:border-0 hover:bg-paper/50">
                <td class="px-5 py-3.5 font-semibold" th:text="'#' + ${o.id}">#1</td>
                <td class="px-5 py-3.5 text-navy-soft" th:text="${o.userId}">1</td>
                <td class="px-5 py-3.5 text-right" th:text="${#numbers.formatInteger(o.subtotal, 0, 'COMMA')}">0</td>
                <td class="px-5 py-3.5 text-right text-navy-soft" th:text="${#numbers.formatInteger(o.shipping, 0, 'COMMA')}">0</td>
                <td class="px-5 py-3.5 text-right font-bold" th:text="${#numbers.formatInteger(o.total, 0, 'COMMA')} + '원'">0원</td>
                <td class="px-5 py-3.5 text-center">
                    <span th:replace="~{fragments/ui :: statusBadge(${o.status})}"></span>
                </td>
                <td class="px-5 py-3.5">
                    <form th:action="@{/admin/orders/{id}/status(id=${o.id})}" method="post"
                          class="flex items-center justify-center gap-1.5">
                        <select name="status"
                                class="rounded-lg border border-line bg-white px-2 py-1.5 text-xs text-navy">
                            <option value="PENDING"   th:selected="${o.status == 'PENDING'}">결제대기</option>
                            <option value="PAID"      th:selected="${o.status == 'PAID'}">결제완료</option>
                            <option value="SHIPPING"  th:selected="${o.status == 'SHIPPING'}">배송중</option>
                            <option value="DELIVERED" th:selected="${o.status == 'DELIVERED'}">배송완료</option>
                            <option value="CANCELED"  th:selected="${o.status == 'CANCELED'}">취소</option>
                        </select>
                        <button class="rounded-lg bg-navy px-3 py-1.5 text-xs font-medium text-cream hover:opacity-90">변경</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(orders)}">
                <td colspan="7" class="px-5 py-14 text-center text-navy/35">주문이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
