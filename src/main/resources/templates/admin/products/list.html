<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head><title>상품 관리</title></head>
<body>
<h1 layout:fragment="pageTitle">상품 관리</h1>
<p layout:fragment="pageDesc">판매 상품(SKU)을 등록하고 관리합니다</p>

<div layout:fragment="content">
    <div class="mb-4 flex items-center justify-between">
        <p class="text-sm text-navy-soft">총 <span class="font-bold text-navy" th:text="${#lists.size(products)}">0</span>개</p>
        <a th:href="@{/admin/products/new}"
           class="inline-flex items-center gap-1.5 rounded-xl bg-navy px-4 py-2.5 text-sm font-semibold text-cream transition hover:opacity-90 active:scale-[0.98]">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            상품 등록
        </a>
    </div>

    <div class="overflow-hidden rounded-2xl border border-line bg-white shadow-card">
        <table class="w-full text-sm">
            <thead>
            <tr class="border-b border-line text-left text-xs uppercase tracking-wide text-navy-soft">
                <th class="px-5 py-3 font-semibold">상품</th>
                <th class="px-5 py-3 font-semibold">카테고리</th>
                <th class="px-5 py-3 text-right font-semibold">가격</th>
                <th class="px-5 py-3 text-center font-semibold">평점</th>
                <th class="px-5 py-3 text-center font-semibold">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${products}" class="border-b border-line/60 last:border-0 hover:bg-paper/50">
                <td class="px-5 py-3.5">
                    <div class="flex items-center gap-3">
                        <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-paper text-base">🐾</span>
                        <div class="min-w-0">
                            <div class="flex items-center gap-1.5">
                                <span class="truncate font-semibold" th:text="${p.name}">상품명</span>
                                <span th:if="${p.tag}" class="rounded-full bg-navy/5 px-1.5 py-0.5 text-[10px] font-bold text-navy-soft" th:text="${p.tag}">BEST</span>
                            </div>
                            <div class="font-mono text-xs text-navy/35" th:text="${p.id}">p1</div>
                        </div>
                    </div>
                </td>
                <td class="px-5 py-3.5 text-navy-soft" th:text="${p.cat}">카테고리</td>
                <td class="px-5 py-3.5 text-right">
                    <div class="font-bold" th:text="${#numbers.formatInteger(p.price, 0, 'COMMA')} + '원'">0원</div>
                    <div th:if="${p.was != null}" class="text-xs text-navy/30 line-through" th:text="${#numbers.formatInteger(p.was, 0, 'COMMA')} + '원'"></div>
                </td>
                <td class="px-5 py-3.5 text-center text-navy-soft">
                    <span class="text-amber-400">★</span> <span th:text="${p.rating}">4.8</span>
                </td>
                <td class="px-5 py-3.5">
                    <div class="flex items-center justify-center gap-1.5">
                        <a th:href="@{/admin/products/{id}/edit(id=${p.id})}"
                           class="rounded-lg border border-line px-3 py-1.5 text-xs font-medium text-navy transition hover:bg-paper">수정</a>
                        <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post"
                              onsubmit="return confirm('정말 삭제할까요?');">
                            <button class="rounded-lg border border-red-200 px-3 py-1.5 text-xs font-medium text-red-500 transition hover:bg-red-50">삭제</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="5" class="px-5 py-14 text-center text-navy/35">등록된 상품이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
