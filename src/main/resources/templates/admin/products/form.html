<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head><title>상품 편집</title></head>
<body>
<h1 layout:fragment="pageTitle" th:text="${isNew} ? '상품 등록' : '상품 수정'">상품 편집</h1>
<p layout:fragment="pageDesc" th:text="${isNew} ? '새 상품(SKU)을 추가합니다' : '상품 정보를 수정합니다'">상품 정보</p>

<div layout:fragment="content">
    <form th:action="@{/admin/products/save}" th:object="${form}" method="post" class="max-w-3xl space-y-5">

        <!-- 기본 정보 -->
        <section class="rounded-2xl border border-line bg-white p-6 shadow-card">
            <h2 class="mb-4 text-sm font-bold text-navy-soft">기본 정보</h2>
            <div class="space-y-4">
                <div class="grid grid-cols-3 gap-4">
                    <label class="col-span-2 block">
                        <span class="mb-1.5 block text-sm font-medium">상품명</span>
                        <input type="text" th:field="*{name}" required
                               class="w-full rounded-xl border border-line bg-paper/40 px-3.5 py-2.5 text-sm outline-none transition focus:border-navy focus:bg-white"/>
                    </label>
                    <label class="block">
                        <span class="mb-1.5 block text-sm font-medium">상품 ID</span>
                        <input type="text" th:field="*{id}" th:readonly="${!isNew}" required placeholder="p11"
                               class="w-full rounded-xl border border-line bg-paper/40 px-3.5 py-2.5 font-mono text-sm outline-none transition read-only:text-navy/40 focus:border-navy focus:bg-white"/>
                    </label>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <label class="block">
                        <span class="mb-1.5 block text-sm font-medium">카테고리</span>
                        <input type="text" th:field="*{cat}" placeholder="장난감"
                               class="w-full rounded-xl border border-line bg-paper/40 px-3.5 py-2.5 text-sm outline-none transition focus:border-navy focus:bg-white"/>
                    </label>
                    <label class="block">
                        <span class="mb-1.5 block text-sm font-medium">짧은 이름 / 반려동물</span>
                        <input type="text" th:field="*{pet}" placeholder="깃털 낚싯대"
                               class="w-full rounded-xl border border-line bg-paper/40 px-3.5 py-2.5 text-sm outline-none transition focus:border-navy focus:bg-white"/>
                    </label>
                </div>
                <label class="block">
                    <span class="mb-1.5 block text-sm font-medium">요약 설명</span>
                    <textarea th:field="*{desc}" rows="3"
                              class="w-full rounded-xl border border-line bg-paper/40 px-3.5 py-2.5 text-sm outline-none transition focus:border-navy focus:bg-white"></textarea>
                </label>
            </div>
        </section>

        <!-- 가격 -->
        <section class="rounded-2xl border border-line bg-white p-6 shadow-card">
            <h2 class="mb-4 text-sm font-bold text-navy-soft">가격</h2>
            <div class="grid grid-cols-3 gap-4">
                <label class="block">
                    <span class="mb-1.5 block text-sm font-medium">판매가 (원)</span>
                    <input type="number" th:field="*{price}" required
                           class="w-full rounded-xl border border-line bg-paper/40 px-3.5 py-2.5 text-sm outline-none transition focus:border-navy focus:bg-white"/>
                </label>
                <label class="block">
                    <span class="mb-1.5 block text-sm font-medium">정가 <span class="text-navy/35">(선택)</span></span>
                    <input type="number" th:field="*{was}" placeholder="할인 전 가격"
                           class="w-full rounded-xl border border-line bg-paper/40 px-3.5 py-2.5 text-sm outline-none transition focus:border-navy focus:bg-white"/>
                </label>
                <label class="block">
                    <span class="mb-1.5 block text-sm font-medium">태그 <span class="text-navy/35">(선택)</span></span>
                    <input type="text" th:field="*{tag}" placeholder="BEST / 신상"
                           class="w-full rounded-xl border border-line bg-paper/40 px-3.5 py-2.5 text-sm outline-none transition focus:border-navy focus:bg-white"/>
                </label>
            </div>
        </section>

        <!-- 부가 정보 -->
        <section class="rounded-2xl border border-line bg-white p-6 shadow-card">
            <h2 class="mb-4 text-sm font-bold text-navy-soft">부가 정보</h2>
            <div class="grid grid-cols-4 gap-4">
                <label class="block">
                    <span class="mb-1.5 block text-sm font-medium">평점</span>
                    <input type="number" step="0.1" th:field="*{rating}"
                           class="w-full rounded-xl border border-line bg-paper/40 px-3.5 py-2.5 text-sm outline-none transition focus:border-navy focus:bg-white"/>
                </label>
                <label class="block">
                    <span class="mb-1.5 block text-sm font-medium">리뷰 수</span>
                    <input type="number" th:field="*{reviews}"
                           class="w-full rounded-xl border border-line bg-paper/40 px-3.5 py-2.5 text-sm outline-none transition focus:border-navy focus:bg-white"/>
                </label>
                <label class="block">
                    <span class="mb-1.5 block text-sm font-medium">정렬 순서</span>
                    <input type="number" th:field="*{sortOrder}"
                           class="w-full rounded-xl border border-line bg-paper/40 px-3.5 py-2.5 text-sm outline-none transition focus:border-navy focus:bg-white"/>
                </label>
                <label class="block">
                    <span class="mb-1.5 block text-sm font-medium">이미지(ph)</span>
                    <input type="text" th:field="*{ph}"
                           class="w-full rounded-xl border border-line bg-paper/40 px-3.5 py-2.5 text-sm outline-none transition focus:border-navy focus:bg-white"/>
                </label>
                <label class="block">
                    <span class="mb-1.5 block text-sm font-medium">재고</span>
                    <input type="number" th:field="*{stock}" class="w-full rounded-xl border border-line bg-paper/40 px-3.5 py-2.5 text-sm outline-none transition focus:border-navy focus:bg-white"/>
                </label>
            </div>
        </section>

        <!-- 액션 -->
        <div class="flex items-center gap-2">
            <button class="rounded-xl bg-navy px-6 py-3 font-semibold text-cream transition hover:opacity-90 active:scale-[0.99]">저장</button>
            <a th:href="@{/admin/products}" class="rounded-xl border border-line bg-white px-6 py-3 font-medium text-navy-soft transition hover:bg-paper">취소</a>
        </div>
    </form>

    <div th:if="${!isNew}" class="mt-5 grid max-w-3xl gap-5 sm:grid-cols-2">
        <!-- 사진 교체 (멀티파트 별도 폼) -->
        <section class="rounded-2xl border border-line bg-white p-6 shadow-card">
            <h2 class="mb-4 text-sm font-bold text-navy-soft">상품 사진</h2>
            <img th:if="${form.imageUrl}" th:src="${form.imageUrl}" alt="상품 사진" class="mb-3 h-40 w-full rounded-xl object-cover"/>
            <form th:action="@{/admin/products/{id}/image(id=${form.id})}" method="post" enctype="multipart/form-data">
                <input type="file" name="image" accept="image/*" required class="text-sm"/>
                <button class="mt-3 rounded-lg bg-navy px-4 py-2 text-sm font-semibold text-cream">사진 업로드</button>
            </form>
        </section>

        <!-- 할인 설정 -->
        <section class="rounded-2xl border border-line bg-white p-6 shadow-card">
            <h2 class="mb-4 text-sm font-bold text-navy-soft">할인 설정</h2>
            <form th:action="@{/admin/products/{id}/discount(id=${form.id})}" method="post" class="flex items-end gap-2">
                <label class="flex-1">
                    <span class="mb-1 block text-sm">할인율 (%)</span>
                    <input type="number" name="rate" min="1" max="90" required class="w-full rounded-lg border border-line px-3 py-2"/>
                </label>
                <button class="rounded-lg bg-navy px-4 py-2 text-sm font-semibold text-cream">적용</button>
            </form>
            <form th:action="@{/admin/products/{id}/discount/clear(id=${form.id})}" method="post" class="mt-2">
                <button class="text-xs text-navy-soft underline">할인 해제</button>
            </form>
        </section>
    </div>
</div>
</body>
</html>
