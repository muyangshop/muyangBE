<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head><title>배너 관리</title></head>
<body>
<h1 layout:fragment="pageTitle">배너 관리</h1>
<p layout:fragment="pageDesc">홈 배너 이미지를 교체합니다</p>
<div layout:fragment="content">
    <div class="grid gap-4 sm:grid-cols-2">
        <div th:each="b : ${banners}" class="rounded-2xl border border-line bg-white p-5 shadow-card">
            <img th:if="${b.imageUrl}" th:src="${b.imageUrl}" alt="배너"
                 class="mb-3 h-40 w-full rounded-xl object-cover"/>
            <div th:unless="${b.imageUrl}" class="mb-3 flex h-40 w-full items-center justify-center rounded-xl bg-paper text-navy/30">이미지 없음</div>
            <p class="font-bold text-navy" th:text="${b.title}">타이틀</p>
            <p class="text-sm text-navy-soft" th:text="${b.big}">서브</p>
            <form th:action="@{/admin/banners/{id}/image(id=${b.id})}" method="post" enctype="multipart/form-data" class="mt-3">
                <input type="file" name="image" accept="image/*" required class="text-sm"/>
                <button class="mt-2 rounded-lg bg-navy px-4 py-2 text-sm font-semibold text-cream">배너 교체</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
