<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head><title>회원 관리</title></head>
<body>
<h1 layout:fragment="pageTitle">회원 관리</h1>
<p layout:fragment="pageDesc">가입 회원 목록을 확인합니다</p>

<div layout:fragment="content">
    <p class="mb-4 text-sm text-navy-soft">총 <span class="font-bold text-navy" th:text="${#lists.size(members)}">0</span>명</p>

    <div class="overflow-hidden rounded-2xl border border-line bg-white shadow-card">
        <table class="w-full text-sm">
            <thead>
            <tr class="border-b border-line text-left text-xs uppercase tracking-wide text-navy-soft">
                <th class="px-5 py-3 font-semibold">회원</th>
                <th class="px-5 py-3 font-semibold">이메일</th>
                <th class="px-5 py-3 text-center font-semibold">등급</th>
                <th class="px-5 py-3 text-center font-semibold">권한</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${members}" class="border-b border-line/60 last:border-0 hover:bg-paper/50">
                <td class="px-5 py-3.5">
                    <div class="flex items-center gap-3">
                        <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-navy/5 text-sm font-bold text-navy-soft"
                              th:text="${#strings.isEmpty(m.name)} ? '?' : ${#strings.substring(m.name,0,1)}">김</span>
                        <div>
                            <div class="font-semibold" th:text="${m.name}">홍길동</div>
                            <div class="text-xs text-navy/35" th:text="'#' + ${m.id}">#1</div>
                        </div>
                    </div>
                </td>
                <td class="px-5 py-3.5 text-navy-soft" th:text="${m.email}">user@x.com</td>
                <td class="px-5 py-3.5 text-center">
                    <span class="rounded-full bg-paper px-2.5 py-1 text-xs font-semibold text-navy-soft" th:text="${m.grade} ?: '-'">BRONZE</span>
                </td>
                <td class="px-5 py-3.5 text-center">
                    <span th:if="${m.role == 'ADMIN'}" class="rounded-full bg-navy px-2.5 py-1 text-xs font-bold text-cream">ADMIN</span>
                    <span th:unless="${m.role == 'ADMIN'}" class="text-xs text-navy/40">일반</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(members)}">
                <td colspan="4" class="px-5 py-14 text-center text-navy/35">회원이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
